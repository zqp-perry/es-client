name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 新版 npm 不会自动执行 electron 二进制下载,显式补一步(失败会立刻报错)
      - run: node node_modules/electron/install.js
      - run: npm run icon
      - run: bash build-dmg.sh
        env:
          SHARE: '1'
          ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 便携版 zip:与 macOS 本地验证过的 build-win.sh 同一链路(含图标/版本信息)
      - run: bash build-win.sh
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ES客户端 ${{ github.ref_name }}
          body: |
            ## 下载 / Downloads

            - **M 系列 Mac / Apple Silicon**: `ESClient-${{ github.ref_name }}-macos-arm64.dmg`
            - **Intel Mac**: `ESClient-${{ github.ref_name }}-macos-x64.dmg`
            - **Windows x64**: `ESClient-${{ github.ref_name }}-win-x64-portable.zip`

            macOS 安装包支持 **macOS 12 Monterey 或更高版本（包含 12.5）**。
            Electron 固定为 43.8.4，修复旧安装包要求 macOS 13、导致 macOS 12 无法启动的问题。
            安装包不含内置连接，打开后请自行配置 Elasticsearch 地址和账号。
          files: out/*
          generate_release_notes: true
