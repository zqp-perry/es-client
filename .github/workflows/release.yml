name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 新版 npm 不会自动执行 electron 二进制下载,显式补一步(失败会立刻报错)
      - run: node node_modules/electron/install.js
      - run: npm run icon
      - run: bash build-dmg.sh
        env:
          SHARE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 便携版 zip:与 macOS 本地验证过的 build-win.sh 同一链路(含图标/版本信息)
      - run: bash build-win.sh
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
